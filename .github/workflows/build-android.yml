name: Build and Release Android App

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist/MessMate.apk \;
          cp dist/MessMate.apk dist/MessMate-latest.apk
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessMate-Android-APK
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.1
          name: 'Mess Mate Android App v1.0.1'
          make_latest: true
          body: |
            ### 📱 Mess Mate Android Application (Full Vercel Edition)
            Official Android release for **Mess Mate** — Complete Campus Nutrition, Real Food Court Outlets, Daily Menus & Fit Scores.
            
            #### 📥 Direct APK Downloads:
            - **[MessMate.apk](https://github.com/yaswanthmalapati23-del/Mess-Mate/releases/download/v1.0.1/MessMate.apk)** (Latest v1.0.1)
            - **[MessMate-latest.apk](https://github.com/yaswanthmalapati23-del/Mess-Mate/releases/download/v1.0.1/MessMate-latest.apk)**
            
            #### 🚀 Installation Instructions:
            1. Download `MessMate.apk` on your Android phone.
            2. Tap the file in your notifications or Downloads folder to install.
            3. If prompted, allow "Install from unknown sources" for your browser/file manager.
            4. Open Mess Mate and enjoy the complete campus mess app!
          files: |
            dist/MessMate.apk
            dist/MessMate-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
